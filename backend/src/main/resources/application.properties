# =============================================================================
# Relay API — local development
# Eclipse STS: import backend/ as Maven project → Run RelayApplication
# =============================================================================

spring.application.name=relay-api

# -----------------------------------------------------------------------------
# MySQL (local installation)
# Create the database first:  CREATE DATABASE relay CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# Set your local MySQL username and password below.
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/relay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sanjay@1083
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway — schema migrations run automatically on startup
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.clean-on-validation-error=false

# Mail (optional for local dev — password-reset emails; configure if you run a local SMTP server)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

server.port=8080
server.error.include-message=always

management.endpoints.web.exposure.include=health,info,metrics,prometheus,env
management.endpoint.health.show-details=always
management.metrics.tags.application=relay-api
management.metrics.export.prometheus.enabled=true
management.server.port=8081

# JWT
relay.jwt.secret=change-me-in-production-use-at-least-256-bits-for-hs256
relay.jwt.access-token-expiration-ms=900000
relay.jwt.refresh-token-expiration-ms=604800000

# Auth
relay.auth.frontend-url=http://localhost:5174
relay.auth.password-reset-expiration-ms=3600000
relay.auth.refresh-cookie-name=relay_refresh_token
relay.auth.refresh-cookie-secure=false

# CORS — Vite dev server
relay.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174

# Object storage (optional until file-sharing phase; used with Docker in production)
relay.storage.endpoint=http://localhost:9000
relay.storage.access-key=relay_minio
relay.storage.secret-key=relay_minio_secret
relay.storage.bucket=relay-files
relay.storage.region=us-east-1

logging.level.com.relay=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
