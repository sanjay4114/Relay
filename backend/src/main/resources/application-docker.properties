# Spring profile for Docker/production deployment
# Activate with: SPRING_PROFILES_ACTIVE=docker

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/relay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:relay}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:relay}

spring.mail.host=${SPRING_MAIL_HOST:mailpit}
spring.mail.port=${SPRING_MAIL_PORT:1025}

relay.jwt.secret=${RELAY_JWT_SECRET}
relay.auth.frontend-url=${RELAY_AUTH_FRONTEND_URL:http://localhost:5173}
relay.cors.allowed-origins=${RELAY_CORS_ORIGINS:http://localhost:5173}
relay.storage.endpoint=${RELAY_STORAGE_ENDPOINT:http://minio:9000}
relay.storage.access-key=${RELAY_STORAGE_ACCESS_KEY:relay_minio}
relay.storage.secret-key=${RELAY_STORAGE_SECRET_KEY:relay_minio_secret}

logging.level.com.relay=INFO
logging.level.org.hibernate.SQL=WARN
