# Test profile — in-memory H2 (activated by @ActiveProfiles("test"))

spring.datasource.url=jdbc:h2:mem:relay_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

relay.jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
relay.jwt.access-token-expiration-ms=900000
relay.jwt.refresh-token-expiration-ms=604800000

relay.auth.frontend-url=http://localhost:5173
relay.auth.password-reset-expiration-ms=3600000
relay.auth.refresh-cookie-name=relay_refresh_token
relay.auth.refresh-cookie-secure=false

relay.cors.allowed-origins=http://localhost:5173

relay.storage.endpoint=http://localhost:9000
relay.storage.access-key=test
relay.storage.secret-key=test
relay.storage.bucket=test
relay.storage.region=us-east-1
